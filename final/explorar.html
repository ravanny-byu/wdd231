<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiosidades e Explorar | Mundo Inexplorado</title>
    <meta name="description" content="Curiosidades históricas e envio de sugestões no Mundo Inexplorado.">
    <meta name="author" content="Ravanny">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos/estilo.css">
    <script type="module" src="scripts/main.js"></script>
</head>
<body data-page="explorar">
    <header>
        <div class="header-inner">
            <a class="brand-title" href="index.html">Mundo Inexplorado</a>
            <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-list">☰ Menu</button>
            <nav aria-label="Navegação principal">
                <ul id="nav-list">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="destinos.html">Destinos</a></li>
                    <li><a href="explorar.html" aria-current="page">Curiosidades</a></li>
                    <li><a href="atribuciones.html">Atribuições</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section>
            <h1>Curiosidades e Histórias Fascinantes</h1>
            <div id="lista-curiosidades" class="cards-grid"></div>
        </section>

        <section>
            <h2>Sugerir um Lugar ou Curiosidade</h2>
            <form id="form-sugestao" class="form-box">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" type="text" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div class="form-group">
                    <label for="lugar">Lugar ou destino</label>
                    <input id="lugar" name="lugar" type="text" required>
                </div>
                <div class="form-group">
                    <label for="mensagem">Curiosidade ou comentário</label>
                    <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
                </div>
                <button class="btn" type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="ano-atual">2026</span> Mundo Inexplorado · <a href="atribuciones.html">Atribuições</a></p>
    </footer>
</body>
</html>
